<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Now</title>
<style>
  @property --sky1 { syntax:'<color>'; inherits:true; initial-value:#eef4f8; }
  @property --sky2 { syntax:'<color>'; inherits:true; initial-value:#d3e4f1; }
  :root {
    --bg:#eef4f8; --card:#ffffff; --glass:rgba(255,255,255,.88);
    --text:#14222e; --muted:#5b6b78; --accent:#1f6fa8; --line:#d5e1ea;
    --sky1:#eef4f8; --sky2:#d3e4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1a23; --card:#172632; --glass:rgba(23,38,50,.86);
      --text:#e8f0f6; --muted:#93a7b5; --accent:#5fb0e6; --line:#25394a;
      --sky1:#0f1a23; --sky2:#16293a;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", Calibri, Arial, sans-serif; color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:32px 16px;
         background:linear-gradient(160deg, var(--sky1), var(--sky2)) fixed;
         transition:--sky1 1.6s ease, --sky2 1.6s ease; }
  #bg { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
  main { width:100%; max-width:520px; position:relative; }
  h1 { font-size:1.6rem; margin:0 0 16px; }
  body.scene h1 { color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.35); }
  form { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  input { flex:1; min-width:160px; padding:12px 14px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  button { padding:12px 18px; font-size:1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:var(--card); color:var(--accent); border:1px solid var(--accent); }
  input:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .card { background:var(--glass); border:1px solid var(--line); border-radius:12px; padding:24px;
          -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); box-shadow:0 8px 30px rgba(0,0,0,.15); }
  .card.fresh { animation: rise .6s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  .city { color:var(--muted); margin:0 0 4px; }
  .temp { font-size:4rem; font-weight:600; margin:0; line-height:1.1; }
  .cond { font-size:1.15rem; margin:4px 0 0; }
  .wind { color:var(--muted); margin:8px 0 0; }
  .days { list-style:none; padding:0; margin:20px 0 0; border-top:1px solid var(--line); }
  .days li { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .days li:last-child { border-bottom:0; }
  .msg { color:var(--muted); }
  .error { color:#c0392b; }
  @media (prefers-reduced-motion: reduce) { .card.fresh { animation:none; } }
  main { max-width:560px; }
  .hero { text-align:center; padding:4px 0 18px; }
  .heroRow { display:flex; justify-content:center; align-items:center; gap:14px; }
  .bigico { font-size:4rem; display:inline-block; animation:floaty 4s ease-in-out infinite; }
  @keyframes floaty { 50% { transform:translateY(-8px); } }
  .temp { font-size:5.5rem; font-weight:200; margin:0; line-height:1; }
  .hl { color:var(--muted); margin:6px 0 0; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { background:rgba(127,127,127,.13); border-radius:12px; padding:12px 14px; }
  .tile small { display:block; color:var(--muted); margin-bottom:4px; }
  .tile b { font-size:1.15rem; }
  .sec { margin:22px 0 8px; font-weight:600; color:var(--muted); text-transform:uppercase; font-size:.75rem; letter-spacing:.08em; }
  .hourly { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
  .hour { flex:0 0 auto; min-width:60px; display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 6px; border-radius:12px; background:rgba(127,127,127,.13); font-size:.9rem; }
  .hi { font-size:1.5rem; }
  .days li .dn { min-width:96px; }
  .days { margin-top:0; border-top:0; }
  form { gap:12px; align-items:center; }
  .searchbar { flex:1 1 100%; display:flex; align-items:center; gap:6px; padding:6px 6px 6px 16px; border-radius:999px;
    background:var(--glass); border:1px solid var(--line); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:0 6px 24px rgba(0,0,0,.15); transition:box-shadow .25s, transform .25s; }
  .searchbar:focus-within { box-shadow:0 0 0 3px var(--accent), 0 10px 30px rgba(0,0,0,.2); transform:translateY(-1px); }
  .searchbar input { flex:1; min-width:0; border:0; background:transparent; padding:10px 4px; outline:none; color:var(--text); }
  .searchbar input:focus-visible { outline:none; }
  .searchbar input::placeholder { color:var(--muted); }
  .go { padding:11px 22px; border-radius:999px; font-weight:600; letter-spacing:.02em; color:#fff;
    background:linear-gradient(135deg,#ff9a3c,#ff5e62); box-shadow:0 4px 14px rgba(255,94,98,.45);
    transition:transform .15s, box-shadow .2s, filter .2s; }
  .go:hover { transform:translateY(-1px); filter:brightness(1.08); box-shadow:0 8px 20px rgba(255,94,98,.5); }
  .go:active { transform:scale(.96); }
  .chip { padding:9px 18px; border-radius:999px; font-size:.95rem; color:var(--text); background:var(--glass);
    border:1px solid var(--line); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:0 4px 14px rgba(0,0,0,.12); transition:transform .15s, box-shadow .2s; }
  .chip:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.2); }
  .chip:active { transform:scale(.96); }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main>
  <h1>Weather Now</h1>

  <form id="searchForm">
    <div class="searchbar">
      <span class="s-ico" aria-hidden="true">🔍</span>
      <input id="cityInput" type="text" placeholder="Search a city, e.g. Meerut" aria-label="City name" required>
      <button type="submit" class="go">Search</button>
    </div>
  </form>

  <section class="card" id="result" aria-live="polite">
    <p class="msg">Detecting your location...</p>
  </section>
</main>

<script>
  // STEP 1: Get references to the HTML elements we need
  const form = document.getElementById("searchForm");
  const input = document.getElementById("cityInput");
  const result = document.getElementById("result");

  // STEP 2: Weather codes (sent by the API) -> readable text
  function describe(code) {
    if (code === 0) return "Clear sky";
    if (code <= 3) return "Partly cloudy";
    if (code <= 48) return "Fog";
    if (code <= 57) return "Drizzle";
    if (code <= 67) return "Rain";
    if (code <= 77) return "Snow";
    if (code <= 82) return "Rain showers";
    if (code <= 86) return "Snow showers";
    return "Thunderstorm";
  }

  // STEP 3: API call #1 - convert the city name to latitude/longitude
  async function getCoordinates(city) {
    const url = "https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(city);
    const response = await fetch(url);
    const data = await response.json();
    if (!data.results) throw new Error("City not found. Check the spelling and try again.");
    return data.results[0];
  }

  // STEP 4: API call #2 - get the weather for those coordinates
  async function getWeather(lat, lon) {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,weathercode&timezone=auto";
    const response = await fetch(url);
    if (!response.ok) throw new Error("Weather service is not responding. Try again later.");
    return response.json();
  }

  // STEP 5: Show the data on the page (and switch the animated background)
  function icon(code, day) {
    if (code === 0) return day ? "☀️" : "🌙";
    if (code <= 3) return day ? "⛅" : "☁️";
    if (code <= 48) return "🌫️";
    if (code <= 57) return "🌦️";
    if (code <= 67) return "🌧️";
    if (code <= 77) return "❄️";
    if (code <= 82) return "🌧️";
    if (code <= 86) return "🌨️";
    return "⛈️";
  }

  function render(place, weather) {
    const now = weather.current_weather;
    const d = weather.daily, h = weather.hourly;
    const dayNow = now.is_day !== 0;
    let i0 = h.time.indexOf(now.time.slice(0, 13) + ":00");
    if (i0 < 0) i0 = 0;

    let hours = "";
    for (let i = i0; i < i0 + 9 && i < h.time.length; i++) {
      const hr = parseInt(h.time[i].slice(11, 13), 10);
      hours += '<div class="hour"><span>' + (i === i0 ? "Now" : h.time[i].slice(11, 16)) +
        '</span><span class="hi">' + icon(h.weathercode[i], hr >= 6 && hr < 18) +
        "</span><b>" + Math.round(h.temperature_2m[i]) + "°</b></div>";
    }

    let rows = "";
    for (let i = 1; i <= 5; i++) {
      const day = new Date(d.time[i]).toLocaleDateString("en-IN", { weekday: "long" });
      rows += '<li><span class="dn">' + day + "</span><span>" + icon(d.weathercode[i], true) + " " +
        describe(d.weathercode[i]) + "</span><span>" +
        Math.round(d.temperature_2m_min[i]) + "° / " + Math.round(d.temperature_2m_max[i]) + "°</span></li>";
    }

    const tiles = [
      ["🌡️", "Feels like", Math.round(h.apparent_temperature[i0]) + "°"],
      ["💧", "Humidity", h.relative_humidity_2m[i0] + "%"],
      ["💨", "Wind", now.windspeed + " km/h"],
      ["🌅", "Sunrise / Sunset", d.sunrise[0].slice(11, 16) + " / " + d.sunset[0].slice(11, 16)]
    ].map(function (x) {
      return '<div class="tile"><small>' + x[0] + " " + x[1] + "</small><b>" + x[2] + "</b></div>";
    }).join("");

    result.innerHTML =
      '<div class="hero"><p class="city">' + place.name + (place.country ? ", " + place.country : "") + "</p>" +
      '<div class="heroRow"><span class="bigico">' + icon(now.weathercode, dayNow) + "</span>" +
      '<p class="temp">' + Math.round(now.temperature) + "°</p></div>" +
      '<p class="cond">' + describe(now.weathercode) + "</p>" +
      '<p class="hl">H: ' + Math.round(d.temperature_2m_max[0]) + "°  L: " + Math.round(d.temperature_2m_min[0]) + "°</p></div>" +
      '<div class="tiles">' + tiles + "</div>" +
      '<p class="sec">Hourly</p><div class="hourly">' + hours + "</div>" +
      '<p class="sec">Next 5 days</p><ul class="days">' + rows + "</ul>";

    result.classList.remove("fresh");
    void result.offsetWidth;
    result.classList.add("fresh");

    setScene(now.weathercode, dayNow);
  }

  // STEP 6: Search button
  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    result.innerHTML = '<p class="msg">Loading...</p>';
    try {
      const place = await getCoordinates(input.value.trim());
      const weather = await getWeather(place.latitude, place.longitude);
      render(place, weather);
    } catch (error) {
      result.innerHTML = '<p class="error">' + error.message + "</p>";
    }
  });

  // STEP 7: Coordinates -> place name (free reverse geocoding API)
  async function getPlaceName(lat, lon) {
    try {
      const url = "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat +
        "&longitude=" + lon + "&localityLanguage=en";
      const response = await fetch(url);
      const data = await response.json();
      return { name: data.city || data.locality || "Your location", country: data.countryName || "" };
    } catch (e) {
      return { name: "Your location", country: "" };
    }
  }

  // STEP 8: "My Location" button
  // Approximate location from the IP address (works even if GPS permission is blocked)
  async function getIpLocation() {
    const sources = [
      async function () {
        const r = await fetch("https://get.geojs.io/v1/ip/geo.json");
        const d = await r.json();
        return { lat: +d.latitude, lon: +d.longitude, name: d.city, country: d.country };
      },
      async function () {
        const r = await fetch("https://ipapi.co/json/");
        const d = await r.json();
        return { lat: +d.latitude, lon: +d.longitude, name: d.city, country: d.country_name };
      }
    ];
    for (const get of sources) {
      try {
        const p = await get();
        if (isFinite(p.lat) && isFinite(p.lon)) return p;
      } catch (e) { /* try the next source */ }
    }
    throw new Error("no ip location");
  }

  async function fallbackToIp(reason) {
    try {
      const p = await getIpLocation();
      const weather = await getWeather(p.lat, p.lon);
      render({ name: (p.name || "Your area") + " (approx.)", country: p.country || "" }, weather);
    } catch (e) {
      result.innerHTML = '<p class="error">' + reason + "</p>";
    }
  }

  // Runs automatically on page load.
  // 1) exact GPS/Wi-Fi location  2) if blocked or failed -> approximate IP location
  function useMyLocation() {
    result.innerHTML = '<p class="msg">Getting your location...</p>';

    if (!navigator.geolocation) {
      fallbackToIp("Your browser does not support location. Please search by city.");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async function (pos) {
        try {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const place = await getPlaceName(lat, lon);
          const weather = await getWeather(lat, lon);
          render(place, weather);
        } catch (error) {
          result.innerHTML = '<p class="error">' + error.message + "</p>";
        }
      },
      function (err) {
        const msg = err.code === 1
          ? "Location permission denied. Allow location access in your browser, or search by city."
          : "Could not get your location. Please search by city.";
        fallbackToIp(msg);
      },
      { timeout: 10000, maximumAge: 300000 }
    );
  }


  // =====================================================
  // ANIMATED BACKGROUND v2 (canvas)
  // Soft volumetric clouds, depth-layered rain with ripples,
  // forked lightning, layered snow, sun rays + lens flare,
  // moon, twinkling stars, shooting stars, drifting fog.
  // =====================================================
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");

  let reduceMotion = false;           // false = animations ON (✨ button toggles)
  let running = false, W = 0, H = 0, lastT = 0, fade = 0;
  let scene = "idle", isDay = true;
  let clouds = [], fogBands = [], rainL = [[], [], []], snowL = [[], [], []];
  let stars = [], motes = [], ripples = [], bolt = null, shoot = null;
  let nextBolt = 3, nextShoot = 5;
  let sprCloud = null, sprFog = null;

  // Sky colours: [day top, day bottom, night top, night bottom]
  const SKY = {
    clear:  ["#2f80d8", "#9ad3f5", "#070b1f", "#1d3166"],
    clouds: ["#6f8399", "#b5c4d2", "#1c2530", "#34414f"],
    fog:    ["#8a96a0", "#c2cbd1", "#252d34", "#3d474f"],
    rain:   ["#3d5064", "#788ea1", "#121a23", "#25313d"],
    snow:   ["#6f88a3", "#bccbd9", "#1f2b3a", "#3b4c60"],
    storm:  ["#232933", "#454e62", "#0a0d14", "#1e2432"]
  };

  function sceneFor(code) {
    if (code === 0) return "clear";
    if (code <= 3) return "clouds";
    if (code <= 48) return "fog";
    if (code <= 67) return "rain";
    if (code <= 77) return "snow";
    if (code <= 82) return "rain";
    if (code <= 86) return "snow";
    return "storm";
  }

  function setScene(code, day) {
    scene = sceneFor(code);
    isDay = day;
    const c = SKY[scene];
    document.body.classList.add("scene");
    document.body.style.setProperty("--sky1", day ? c[0] : c[2]);
    document.body.style.setProperty("--sky2", day ? c[1] : c[3]);
    fade = 0;
    initScene();
    start();
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // ---------- sprites (drawn once, reused every frame) ----------
  function makeCloudSprite(rgb) {
    const w = 420, h = 200;
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d");
    const blobs = [[.28,.62,.2],[.45,.45,.26],[.62,.55,.22],[.78,.64,.16],[.5,.7,.24],[.35,.5,.16],[.68,.4,.14]];
    for (const b of blobs) {
      const x = b[0] * w, y = b[1] * h, r = b[2] * w * 0.6;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, "rgba(" + rgb + ",.6)");
      gr.addColorStop(.6, "rgba(" + rgb + ",.24)");
      gr.addColorStop(1, "rgba(" + rgb + ",0)");
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
    }
    return c;
  }
  function makeFogSprite(rgb) {
    const c = document.createElement("canvas"); c.width = 600; c.height = 240;
    const g = c.getContext("2d");
    g.translate(300, 120); g.scale(1, 0.4);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, 300);
    gr.addColorStop(0, "rgba(" + rgb + ",.55)");
    gr.addColorStop(.55, "rgba(" + rgb + ",.22)");
    gr.addColorStop(1, "rgba(" + rgb + ",0)");
    g.fillStyle = gr; g.fillRect(-300, -300, 600, 600);
    return c;
  }
  function makeFlakeSprite() {
    const c = document.createElement("canvas"); c.width = c.height = 32;
    const g = c.getContext("2d");
    const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(.4, "rgba(255,255,255,.7)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    return c;
  }
  const sprFlake = makeFlakeSprite();

  function cloudRGB() {
    const n = !isDay;
    switch (scene) {
      case "storm":  return n ? "38,44,60"    : "66,72,90";
      case "rain":   return n ? "72,84,104"   : "145,157,172";
      case "snow":   return n ? "150,165,195" : "236,241,249";
      case "fog":    return n ? "120,130,148" : "228,232,237";
      case "clouds": return n ? "130,146,182" : "255,255,255";
      case "clear":  return n ? "140,156,205" : "255,255,255";
      default:       return darkMQ.matches ? "95,176,230" : "70,140,200";
    }
  }

  // ---------- build the particles for the current scene ----------
  function initScene() {
    const area = W * H, small = W < 700;
    clouds = []; fogBands = []; rainL = [[], [], []]; snowL = [[], [], []];
    stars = []; motes = []; ripples = []; bolt = null; shoot = null;

    sprCloud = makeCloudSprite(cloudRGB());
    buildLandscape();

    const count = { clear: 4, clouds: 9, rain: 8, storm: 10, snow: 7, idle: 5 }[scene] || 0;
    const baseA = { storm: .9, rain: .75, clouds: .7, snow: .55, clear: isDay ? .65 : .25, idle: .4 }[scene] || .5;
    for (let i = 0; i < count; i++) {
      clouds.push({
        x: rand(-200, W), y: rand(-20, H * (scene === "storm" ? .4 : .55)),
        s: rand(.8, 1.9) * (small ? .7 : 1), v: rand(6, 22),
        a: baseA * rand(.7, 1), p: rand(0, 6.28)
      });
    }

    if (scene === "fog") {
      sprFog = makeFogSprite(cloudRGB());
      for (let i = 0; i < 8; i++)
        fogBands.push({ x: rand(-300, W), y: rand(H * .2, H * .95), s: rand(1.2, 2.6),
                        v: rand(8, 24) * (Math.random() < .5 ? -1 : 1), a: rand(.35, .7) });
    }

    if (scene === "rain" || scene === "storm") {
      const n = clamp(area / 7000, 90, 320) * (scene === "storm" ? 1.5 : 1);
      const F = [.55, .85, 1.25];
      for (let i = 0; i < n; i++) {
        const li = i % 3, f = F[li];
        rainL[li].push({ x: rand(-100, W + 100), y: rand(-H, H), len: rand(10, 20) * f, v: rand(700, 950) * f });
      }
    }

    if (scene === "snow") {
      const n = clamp(area / 8000, 60, 170);
      for (let i = 0; i < n; i++) {
        const li = i % 3;
        const r = [rand(1, 2), rand(2, 3.5), rand(4, 7)][li];
        const v = [rand(25, 45), rand(45, 75), rand(80, 120)][li];
        snowL[li].push({ x: rand(0, W), y: rand(0, H), r: r, v: v, p: rand(0, 6.28), sw: rand(10, 28) });
      }
    }

    if (scene === "clear" && !isDay) {
      for (let i = 0; i < 110; i++)
        stars.push({ x: rand(0, W), y: rand(0, H * .8), r: rand(.3, 1.5), p: rand(0, 6.28), tw: rand(.6, 1.8) });
    }
    if (scene === "clear" && isDay) {            // floating pollen / dust in the sunlight
      for (let i = 0; i < 28; i++)
        motes.push({ x: rand(0, W), y: rand(0, H), r: rand(1, 3), vx: rand(4, 12), vy: rand(-8, -2), p: rand(0, 6.28), kind: "pollen" });
    }
    if (scene === "idle") {                      // soft floating bokeh before weather loads
      for (let i = 0; i < 22; i++)
        motes.push({ x: rand(0, W), y: rand(0, H), r: rand(10, 40), vx: rand(-4, 4), vy: rand(-12, -3), p: rand(0, 6.28), kind: "bokeh" });
    }
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initScene();
    if (reduceMotion) frame(performance.now(), 0);
  }

  // ---------- drawing helpers ----------
  function drawSun(ts) {
    const sx = W * .8, sy = Math.min(170, H * .2);
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(ts * .04);
    ctx.fillStyle = "rgba(255,244,190," + (.07 * fade) + ")";
    const L = Math.max(W, H) * 1.1, N = 14, wedge = .045;
    for (let i = 0; i < N; i++) {
      const a = i * (Math.PI * 2 / N);
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a - wedge) * L, Math.sin(a - wedge) * L);
      ctx.lineTo(Math.cos(a + wedge) * L, Math.sin(a + wedge) * L);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    ctx.globalAlpha = fade;
    const gr = 210 + Math.sin(ts * 1.2) * 14;
    const g = ctx.createRadialGradient(sx, sy, 8, sx, sy, gr);
    g.addColorStop(0, "rgba(255,246,200,.95)");
    g.addColorStop(.22, "rgba(255,226,120,.45)");
    g.addColorStop(1, "rgba(255,226,120,0)");
    ctx.fillStyle = g; ctx.fillRect(sx - gr, sy - gr, gr * 2, gr * 2);
    ctx.fillStyle = "#fff8d6"; ctx.beginPath(); ctx.arc(sx, sy, 34, 0, 6.283); ctx.fill();

    // lens flare dots along the line from the sun through the screen centre
    const flares = [[.35, 22], [.55, 38], [.8, 16]];
    ctx.fillStyle = "rgba(255,255,255,.07)";
    for (const f of flares) {
      ctx.beginPath();
      ctx.arc(sx + (W / 2 - sx) * f[0], sy + (H / 2 - sy) * f[0], f[1], 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawMoon(ts, dt) {
    const mx = W * .8, my = Math.min(150, H * .18);
    for (const s of stars) {
      ctx.globalAlpha = fade * (.35 + .65 * Math.abs(Math.sin(ts * s.tw + s.p)));
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = fade;
    const g = ctx.createRadialGradient(mx, my, 10, mx, my, 160);
    g.addColorStop(0, "rgba(210,225,255,.38)"); g.addColorStop(1, "rgba(210,225,255,0)");
    ctx.fillStyle = g; ctx.fillRect(mx - 160, my - 160, 320, 320);
    const d = ctx.createRadialGradient(mx - 8, my - 8, 4, mx, my, 28);
    d.addColorStop(0, "#fffdf0"); d.addColorStop(1, "#d6d9c4");
    ctx.fillStyle = d; ctx.beginPath(); ctx.arc(mx, my, 28, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(150,155,140,.35)";
    for (const c of [[-8, -5, 6], [7, 6, 4.5], [-2, 10, 3.5]]) {
      ctx.beginPath(); ctx.arc(mx + c[0], my + c[1], c[2], 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // shooting star every so often
    if (dt > 0) {
      nextShoot -= dt;
      if (nextShoot <= 0 && !shoot) {
        shoot = { x: rand(W * .3, W * .95), y: rand(0, H * .3), vx: -rand(500, 800), vy: rand(200, 350), life: 1 };
        nextShoot = rand(6, 13);
      }
    }
    if (shoot) {
      shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt; shoot.life -= dt * 1.4;
      if (shoot.life <= 0) { shoot = null; }
      else {
        const tx = shoot.x - shoot.vx * .12, ty = shoot.y - shoot.vy * .12;
        const lg = ctx.createLinearGradient(tx, ty, shoot.x, shoot.y);
        lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(1, "rgba(255,255,255," + shoot.life + ")");
        ctx.strokeStyle = lg; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(shoot.x, shoot.y); ctx.stroke();
      }
    }
  }

  function drawClouds(ts, dt) {
    for (const c of clouds) {
      const w = 420 * c.s, h = 200 * c.s;
      c.x += c.v * c.s * dt;
      if (c.x > W + 20) c.x = -w;
      ctx.globalAlpha = c.a * fade;
      ctx.drawImage(sprCloud, c.x, c.y + Math.sin(ts / 4 + c.p) * 5, w, h);
    }
    ctx.globalAlpha = 1;
  }

  function drawFog(dt) {
    for (const b of fogBands) {
      const w = 600 * b.s, h = 240 * b.s;
      b.x += b.v * dt;
      if (b.v > 0 && b.x > W) b.x = -w;
      if (b.v < 0 && b.x < -w) b.x = W;
      ctx.globalAlpha = b.a * fade;
      ctx.drawImage(sprFog, b.x, b.y - h / 2, w, h);
    }
    ctx.globalAlpha = 1;
  }

  function drawRain(dt) {
    const slant = scene === "storm" ? .38 : .2;
    const cols = ["rgba(190,210,235,.28)", "rgba(200,218,240,.4)", "rgba(215,230,250,.55)"];
    const widths = [.6, .9, 1.3];
    ctx.globalAlpha = fade;
    for (let li = 0; li < 3; li++) {
      ctx.strokeStyle = cols[li]; ctx.lineWidth = widths[li];
      ctx.beginPath();
      for (const d of rainL[li]) {
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - d.len * slant, d.y + d.len);
        d.y += d.v * dt; d.x -= d.v * slant * dt;
        if (d.y > H + 20) {
          if (li === 2 && ripples.length < 40 && Math.random() < .35)
            ripples.push({ x: d.x, y: H - rand(4, 60), r: 2, a: .5 });
          d.y = -d.len; d.x = rand(-50, W + 150);
        }
      }
      ctx.stroke();
    }
    // splash ripples near the ground
    ctx.lineWidth = 1;
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += 40 * dt; r.a -= dt * 1.1;
      if (r.a <= 0) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = "rgba(220,235,255," + (r.a * fade) + ")";
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * .28, 0, 0, 6.283); ctx.stroke();
    }
    // low mist at the bottom
    const mg = ctx.createLinearGradient(0, H * .7, 0, H);
    mg.addColorStop(0, "rgba(200,215,230,0)");
    mg.addColorStop(1, "rgba(200,215,230," + (isDay ? .2 : .1) + ")");
    ctx.fillStyle = mg; ctx.fillRect(0, H * .7, W, H * .3);
    ctx.globalAlpha = 1;
  }

  function drawSnow(dt, ts) {
    const A = [.45, .65, .85];
    for (let li = 0; li < 3; li++) {
      ctx.globalAlpha = A[li] * fade;
      for (const f of snowL[li]) {
        f.y += f.v * dt;
        f.x += (Math.sin(ts * 1.1 + f.p) * f.sw + 10) * dt;
        if (f.y > H + 10) { f.y = -10; f.x = rand(0, W); }
        if (f.x > W + 10) f.x = -10;
        ctx.drawImage(sprFlake, f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
      }
    }
    const mg = ctx.createLinearGradient(0, H * .75, 0, H);
    mg.addColorStop(0, "rgba(255,255,255,0)"); mg.addColorStop(1, "rgba(255,255,255,.14)");
    ctx.globalAlpha = fade; ctx.fillStyle = mg; ctx.fillRect(0, H * .75, W, H * .25);
    ctx.globalAlpha = 1;
  }

  function makeBolt() {
    const pts = []; let x = rand(W * .15, W * .85), y = 0;
    pts.push([x, y]);
    const endY = H * rand(.45, .7);
    while (y < endY) { y += rand(18, 38); x += rand(-26, 26); pts.push([x, y]); }
    const branches = [];
    for (let i = 3; i < pts.length - 2; i++) {
      if (Math.random() < .22) {
        let bx = pts[i][0], by = pts[i][1];
        const b = [[bx, by]], dir = Math.random() < .5 ? -1 : 1, n = Math.round(rand(3, 6));
        for (let k = 0; k < n; k++) { bx += dir * rand(8, 26); by += rand(10, 26); b.push([bx, by]); }
        branches.push(b);
      }
    }
    return { pts: pts, branches: branches, life: 1 };
  }
  function strokePath(p) {
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
    ctx.stroke();
  }
  function drawLightning(dt) {
    if (dt > 0) {
      nextBolt -= dt;
      if (nextBolt <= 0 && !bolt) { bolt = makeBolt(); nextBolt = rand(2.5, 7); }
    }
    if (!bolt) return;
    bolt.life -= dt * 2.2;
    if (bolt.life <= 0) { bolt = null; return; }
    const flick = bolt.life > .5 ? 1 : (Math.random() < .5 ? 1 : .3);
    const a = bolt.life * flick;
    ctx.fillStyle = "rgba(210,225,255," + (a * .28) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255," + a + ")";
    ctx.shadowColor = "rgba(170,200,255,1)"; ctx.shadowBlur = 22;
    ctx.lineJoin = "round"; ctx.lineWidth = 2.6;
    strokePath(bolt.pts);
    ctx.lineWidth = 1.2;
    for (const b of bolt.branches) strokePath(b);
    ctx.restore();
  }

  function drawMotes(dt, ts) {
    for (const m of motes) {
      m.x += m.vx * dt; m.y += m.vy * dt + Math.sin(ts + m.p) * .15;
      if (m.x > W + 50) m.x = -50; if (m.x < -50) m.x = W + 50;
      if (m.y < -50) m.y = H + 50;
      if (m.kind === "pollen") {
        ctx.globalAlpha = fade * (.3 + .3 * Math.sin(ts * 1.5 + m.p));
        ctx.fillStyle = "#fffbe0";
      } else {
        ctx.globalAlpha = fade * .08;
        ctx.fillStyle = darkMQ.matches ? "#9fd2f5" : "#1f6fa8";
      }
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- landscape: mountains, hills and pine trees ----------
  let land = [], px = 0, tx = 0;
  window.addEventListener("pointermove", function (e) { tx = (e.clientX / (W || 1) - .5) * 2; });

  const LAND = {
    clear:  ["#6f9fc4", "#4d8a66", "#2c5a42"],
    clouds: ["#7d93a8", "#5b7c70", "#3a5649"],
    fog:    ["#9aa8b2", "#8394a0", "#6b7d89"],
    rain:   ["#586f82", "#44625a", "#2d463e"],
    snow:   ["#d4e0ec", "#bccbda", "#9fb1c4"],
    storm:  ["#404c5d", "#324840", "#212f2a"]
  };
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return "rgb(" + Math.round(r * f * .9) + "," + Math.round(g * f * .95) + "," + Math.round(Math.min(255, b * f * 1.15)) + ")";
  }

  function buildLandscape() {
    land = [];
    const pal = LAND[scene] || LAND.clear;
    const f = scene === "idle" ? (darkMQ.matches ? .35 : 1) : (isDay ? 1 : .3);
    const W2 = Math.ceil(W * 1.1) + 20;
    const defs = [
      { base: .72, depth: .4, mount: true,  col: pal[0], trees: false },
      { base: .83, depth: 1,  mount: false, col: pal[1], trees: false },
      { base: .93, depth: 2,  mount: false, col: pal[2], trees: true }
    ];
    defs.forEach(function (d) {
      const c = document.createElement("canvas"); c.width = W2; c.height = H;
      const g = c.getContext("2d");
      const p1 = rand(0, 9), p2 = rand(0, 9);
      const ridge = function (x) {
        return H * d.base - (d.mount
          ? Math.abs(Math.sin(x * .0045 + p1)) * H * .13 + Math.abs(Math.sin(x * .012 + p2)) * H * .035
          : Math.sin(x * .006 + p1) * H * .025 + Math.sin(x * .015 + p2) * H * .012);
      };
      g.fillStyle = shade(d.col, f);
      g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W2; x += 6) g.lineTo(x, ridge(x));
      g.lineTo(W2, H); g.closePath(); g.fill();
      if (d.trees) {
        g.fillStyle = shade(pal[2], f * .75);
        for (let x = 8; x < W2; x += rand(22, 40)) {
          const y = ridge(x) + 2, th = rand(28, 56) * (H / 800 + .4), tw = th * .38;
          for (let k = 0; k < 3; k++) {
            const ty = y - th * k * .28, w = tw * (1 - k * .22);
            g.beginPath(); g.moveTo(x, ty - th * .45); g.lineTo(x - w, ty); g.lineTo(x + w, ty); g.closePath(); g.fill();
          }
        }
      }
      land.push({ c: c, depth: d.depth });
    });
  }

  function drawLand(dt) {
    px += (tx - px) * Math.min(1, dt * 4);
    ctx.globalAlpha = fade;
    for (const l of land) ctx.drawImage(l.c, -10 - px * l.depth * 10, 0);
    ctx.globalAlpha = 1;
  }

  // ---------- one frame ----------
  function frame(t, dt) {
    const ts = t / 1000;
    fade = reduceMotion ? 1 : Math.min(1, fade + dt / 1.2);
    ctx.clearRect(0, 0, W, H);

    if (scene === "clear") { if (isDay) drawSun(ts); else drawMoon(ts, dt); }
    if (scene !== "fog") drawClouds(ts, dt);
    drawLand(dt);
    if (scene === "fog") drawFog(dt);
    if (scene === "rain" || scene === "storm") {
      drawRain(dt);
      if (scene === "storm") drawLightning(dt);
    } else if (scene === "snow") {
      drawSnow(dt, ts);
    }
    if (motes.length) drawMotes(dt, ts);
    ctx.globalAlpha = 1;
  }

  function loop(t) {
    if (reduceMotion) { running = false; return; }
    const dt = Math.min(.05, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    frame(t, dt);
    requestAnimationFrame(loop);
  }

  function start() {
    if (reduceMotion) { frame(performance.now(), 0); return; }
    if (!running) { running = true; lastT = performance.now(); requestAnimationFrame(loop); }
  }

  window.addEventListener("resize", resize);
  resize();
  start();

  // Automatically fetch the weather of the current location when the page opens
  useMyLocation();
</script>
</body>
</html>
