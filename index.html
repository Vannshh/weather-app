<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Now</title>
<style>
  :root {
    --bg:#eef4f8; --card:#ffffff; --glass:rgba(255,255,255,.88);
    --text:#14222e; --muted:#5b6b78; --accent:#1f6fa8; --line:#d5e1ea;
    --sky1:#eef4f8; --sky2:#d3e4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1a23; --card:#172632; --glass:rgba(23,38,50,.86);
      --text:#e8f0f6; --muted:#93a7b5; --accent:#5fb0e6; --line:#25394a;
      --sky1:#0f1a23; --sky2:#16293a;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", Calibri, Arial, sans-serif; color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:32px 16px;
         background:linear-gradient(160deg, var(--sky1), var(--sky2)) fixed; }
  #bg { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
  main { width:100%; max-width:520px; position:relative; }
  h1 { font-size:1.6rem; margin:0 0 16px; }
  body.scene h1 { color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.35); }
  form { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  input { flex:1; min-width:160px; padding:12px 14px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  button { padding:12px 18px; font-size:1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:var(--card); color:var(--accent); border:1px solid var(--accent); }
  input:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .card { background:var(--glass); border:1px solid var(--line); border-radius:12px; padding:24px;
          -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); box-shadow:0 8px 30px rgba(0,0,0,.15); }
  .card.fresh { animation: rise .6s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  .city { color:var(--muted); margin:0 0 4px; }
  .temp { font-size:4rem; font-weight:600; margin:0; line-height:1.1; }
  .cond { font-size:1.15rem; margin:4px 0 0; }
  .wind { color:var(--muted); margin:8px 0 0; }
  .days { list-style:none; padding:0; margin:20px 0 0; border-top:1px solid var(--line); }
  .days li { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .days li:last-child { border-bottom:0; }
  .msg { color:var(--muted); }
  .error { color:#c0392b; }
  @media (prefers-reduced-motion: reduce) { .card.fresh { animation:none; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main>
  <h1>Weather Now</h1>

  <form id="searchForm">
    <input id="cityInput" type="text" placeholder="Enter a city, e.g. Meerut" aria-label="City name" required>
    <button type="submit">Search</button>
    <button type="button" id="locBtn" class="secondary">📍 My Location</button>
  </form>

  <section class="card" id="result" aria-live="polite">
    <p class="msg">Search for a city or use your location to see the weather.</p>
  </section>
</main>

<script>
  // STEP 1: Get references to the HTML elements we need
  const form = document.getElementById("searchForm");
  const input = document.getElementById("cityInput");
  const result = document.getElementById("result");
  const locBtn = document.getElementById("locBtn");

  // STEP 2: Weather codes (sent by the API) -> readable text
  function describe(code) {
    if (code === 0) return "Clear sky";
    if (code <= 3) return "Partly cloudy";
    if (code <= 48) return "Fog";
    if (code <= 57) return "Drizzle";
    if (code <= 67) return "Rain";
    if (code <= 77) return "Snow";
    if (code <= 82) return "Rain showers";
    if (code <= 86) return "Snow showers";
    return "Thunderstorm";
  }

  // STEP 3: API call #1 - convert the city name to latitude/longitude
  async function getCoordinates(city) {
    const url = "https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(city);
    const response = await fetch(url);
    const data = await response.json();
    if (!data.results) throw new Error("City not found. Check the spelling and try again.");
    return data.results[0];
  }

  // STEP 4: API call #2 - get the weather for those coordinates
  async function getWeather(lat, lon) {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto";
    const response = await fetch(url);
    if (!response.ok) throw new Error("Weather service is not responding. Try again later.");
    return response.json();
  }

  // STEP 5: Show the data on the page (and switch the animated background)
  function render(place, weather) {
    const now = weather.current_weather;
    const d = weather.daily;

    let rows = "";
    for (let i = 1; i <= 5; i++) {
      const day = new Date(d.time[i]).toLocaleDateString("en-IN", { weekday: "long" });
      rows += "<li><span>" + day + "</span><span>" + describe(d.weathercode[i]) + "</span><span>" +
        Math.round(d.temperature_2m_min[i]) + "° / " + Math.round(d.temperature_2m_max[i]) + "°</span></li>";
    }

    result.innerHTML =
      '<p class="city">' + place.name + (place.country ? ", " + place.country : "") + "</p>" +
      '<p class="temp">' + Math.round(now.temperature) + "°C</p>" +
      '<p class="cond">' + describe(now.weathercode) + "</p>" +
      '<p class="wind">Wind: ' + now.windspeed + " km/h</p>" +
      '<ul class="days">' + rows + "</ul>";

    // little fade-in animation for the card
    result.classList.remove("fresh");
    void result.offsetWidth;
    result.classList.add("fresh");

    // change the background to match the weather
    setScene(now.weathercode, now.is_day !== 0);
  }

  // STEP 6: Search button
  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    result.innerHTML = '<p class="msg">Loading...</p>';
    try {
      const place = await getCoordinates(input.value.trim());
      const weather = await getWeather(place.latitude, place.longitude);
      render(place, weather);
    } catch (error) {
      result.innerHTML = '<p class="error">' + error.message + "</p>";
    }
  });

  // STEP 7: Coordinates -> place name (free reverse geocoding API)
  async function getPlaceName(lat, lon) {
    try {
      const url = "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat +
        "&longitude=" + lon + "&localityLanguage=en";
      const response = await fetch(url);
      const data = await response.json();
      return { name: data.city || data.locality || "Your location", country: data.countryName || "" };
    } catch (e) {
      return { name: "Your location", country: "" };
    }
  }

  // STEP 8: "My Location" button
  // auto = true  -> runs by itself when the page opens (fails quietly)
  // auto = false -> runs when the user clicks the button (shows errors)
  function useMyLocation(auto) {
    const hint = '<p class="msg">Search for a city or tap 📍 My Location to see the weather.</p>';

    if (!navigator.geolocation) {
      result.innerHTML = auto ? hint : '<p class="error">Your browser does not support location.</p>';
      return;
    }
    result.innerHTML = '<p class="msg">Getting your location...</p>';

    navigator.geolocation.getCurrentPosition(
      async function (pos) {
        try {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const place = await getPlaceName(lat, lon);
          const weather = await getWeather(lat, lon);
          render(place, weather);
        } catch (error) {
          result.innerHTML = '<p class="error">' + error.message + "</p>";
        }
      },
      function (err) {
        if (auto) { result.innerHTML = hint; return; }   // no scary error on page load
        const msg = err.code === 1
          ? "Location permission denied. Allow location access or search by city."
          : "Could not get your location. Try again or search by city.";
        result.innerHTML = '<p class="error">' + msg + "</p>";
      },
      { timeout: 10000 }
    );
  }

  locBtn.addEventListener("click", function () { useMyLocation(false); });

  // =====================================================
  // ANIMATED BACKGROUND (canvas)
  // Scenes: idle, clear, clouds, fog, rain, snow, storm
  // =====================================================
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");

  let W = 0, H = 0;
  let scene = "idle", isDay = true;
  let particles = [], stars = [];
  let flash = 0, running = false;

  // Sky colours for each scene: [day top, day bottom, night top, night bottom]
  const SKY = {
    clear:  ["#3a8dde", "#9ad3f5", "#0b1026", "#233a73"],
    clouds: ["#6f8399", "#b5c4d2", "#1c2530", "#34414f"],
    fog:    ["#8a96a0", "#c2cbd1", "#252d34", "#3d474f"],
    rain:   ["#44586b", "#7d92a4", "#141c25", "#27333f"],
    snow:   ["#6f88a3", "#bccbd9", "#1f2b3a", "#3b4c60"],
    storm:  ["#2a303c", "#4b5468", "#0d1017", "#222836"]
  };

  // Weather code -> scene name
  function sceneFor(code) {
    if (code === 0) return "clear";
    if (code <= 3) return "clouds";
    if (code <= 48) return "fog";
    if (code <= 67) return "rain";
    if (code <= 77) return "snow";
    if (code <= 82) return "rain";
    if (code <= 86) return "snow";
    return "storm";
  }

  function setScene(code, day) {
    scene = sceneFor(code);
    isDay = day;
    const c = SKY[scene];
    document.body.classList.add("scene");
    document.body.style.setProperty("--sky1", day ? c[0] : c[2]);
    document.body.style.setProperty("--sky2", day ? c[1] : c[3]);
    initParticles();
    start();
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initParticles();
    if (reduceMotion) frame(0);
  }

  function initParticles() {
    particles = [];
    stars = [];
    const area = W * H;

    if (scene === "rain" || scene === "storm") {
      const n = Math.round(Math.max(80, Math.min(260, area / 9000)) * (scene === "storm" ? 1.5 : 1));
      for (let i = 0; i < n; i++)
        particles.push({ x: rand(0, W), y: rand(0, H), len: rand(10, 22), v: rand(12, 20) });
    } else if (scene === "snow") {
      const n = Math.max(60, Math.min(170, area / 9000));
      for (let i = 0; i < n; i++)
        particles.push({ x: rand(0, W), y: rand(0, H), r: rand(1, 3.5), v: rand(0.6, 1.8), p: rand(0, 6.28) });
    } else {
      // clouds / fog / clear / idle all use drifting cloud blobs
      const n = { clouds: 7, fog: 10, clear: 3, idle: 5 }[scene] || 5;
      for (let i = 0; i < n; i++)
        particles.push({ x: rand(0, W), y: scene === "fog" ? rand(0, H) : rand(0, H * 0.6),
                         r: rand(50, 130), v: rand(0.15, 0.5) });
    }

    if (scene === "clear" && !isDay) {
      for (let i = 0; i < 80; i++)
        stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.3, 1.5), p: rand(0, 6.28) });
    }
  }

  function drawCloud(c, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    const parts = [[0, 0, 1], [0.9, 0.15, 0.8], [-0.9, 0.2, 0.7], [0.3, -0.35, 0.7]];
    for (const p of parts) {
      const cx = c.x + p[0] * c.r, cy = c.y + p[1] * c.r, rr = c.r * p[2];
      ctx.moveTo(cx + rr, cy);
      ctx.arc(cx, cy, rr, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function frame(t) {
    ctx.clearRect(0, 0, W, H);

    // Sun or moon for clear sky
    if (scene === "clear") {
      const sx = W * 0.82, sy = Math.min(150, H * 0.18);
      const pulse = reduceMotion ? 0 : Math.sin(t / 900) * 14;
      const glowR = 190 + pulse;
      const g = ctx.createRadialGradient(sx, sy, 10, sx, sy, glowR);
      if (isDay) { g.addColorStop(0, "rgba(255,244,190,.95)"); g.addColorStop(0.25, "rgba(255,225,120,.45)"); g.addColorStop(1, "rgba(255,225,120,0)"); }
      else       { g.addColorStop(0, "rgba(235,240,255,.55)"); g.addColorStop(0.3, "rgba(200,215,255,.18)"); g.addColorStop(1, "rgba(200,215,255,0)"); }
      ctx.fillStyle = g;
      ctx.fillRect(sx - glowR, sy - glowR, glowR * 2, glowR * 2);
      ctx.fillStyle = isDay ? "#fff6c9" : "#f4f1de";
      ctx.beginPath(); ctx.arc(sx, sy, isDay ? 34 : 26, 0, Math.PI * 2); ctx.fill();

      for (const s of stars) {
        ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t / 700 + s.p));
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Rain / storm
    if (scene === "rain" || scene === "storm") {
      ctx.strokeStyle = "rgba(205,225,255,.55)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (const p of particles) {
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.len * 0.25, p.y + p.len);
        if (!reduceMotion) {
          p.y += p.v; p.x -= p.v * 0.25;
          if (p.y > H) { p.y = -p.len; p.x = rand(0, W + 100); }
          if (p.x < -20) p.x = W + 20;
        }
      }
      ctx.stroke();

      if (scene === "storm" && !reduceMotion) {
        if (Math.random() < 0.004) flash = 1;
        if (flash > 0.02) {
          ctx.fillStyle = "rgba(255,255,255," + (flash * 0.5) + ")";
          ctx.fillRect(0, 0, W, H);
          flash *= 0.88;
        }
      }
    }

    // Snow
    else if (scene === "snow") {
      ctx.fillStyle = "rgba(255,255,255,.85)";
      for (const p of particles) {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        if (!reduceMotion) {
          p.y += p.v;
          p.x += Math.sin(t / 900 + p.p) * 0.6;
          if (p.y > H + 5) { p.y = -5; p.x = rand(0, W); }
        }
      }
    }

    // Clouds / fog / clear / idle
    else {
      let color = "#ffffff", alpha = 0.22;
      if (scene === "idle")  { color = darkMQ.matches ? "#5fb0e6" : "#1f6fa8"; alpha = 0.10; }
      if (scene === "fog")   { alpha = 0.20; }
      if (scene === "clear") { alpha = isDay ? 0.35 : 0.07; }
      if (scene === "clouds") { alpha = isDay ? 0.28 : 0.10; }
      for (const c of particles) {
        drawCloud(c, color, alpha);
        if (!reduceMotion) {
          c.x += c.v;
          if (c.x - c.r * 1.8 > W) c.x = -c.r * 1.8;
        }
      }
    }
  }

  function loop(t) {
    frame(t);
    requestAnimationFrame(loop);
  }

  function start() {
    if (reduceMotion) { frame(0); return; }   // static picture only
    if (!running) { running = true; requestAnimationFrame(loop); }
  }

  window.addEventListener("resize", resize);
  resize();
  start();

  // Automatically fetch the current location's weather when the page opens
  useMyLocation(true);
</script>
</body>
</html>
